name: Update Neofetch Card

on:
  schedule:
    # Runs automatically every midnight UTC
    - cron: '0 0 * * *'
  # Allows you to trigger it manually anytime from the GitHub "Actions" tab
  workflow_dispatch:

jobs:
  update-card:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Run SVG Generator Script
        run: python generate_svg.py

      - name: Commit and Push Updated SVGs
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          git add neofetch-dark.svg neofetch-light.svg
          git diff --staged --quiet || git commit -m "Auto-update neofetch profile stats [skip ci]"
          git push